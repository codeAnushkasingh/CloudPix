# ==============================================================================
# CloudPix - Apache Reverse Proxy VirtualHost Configuration
# Target: Ubuntu AWS EC2 (Apache 2.4+)
# Location on EC2: /etc/apache2/sites-available/cloudpix.conf
# ==============================================================================

<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    ServerAdmin webmaster@localhost

    # --------------------------------------------------------------------------
    # Upload Size Limit (5 MB = 5242880 bytes)
    # Ensures client uploads up to 5 MB are permitted and larger files are rejected early.
    # --------------------------------------------------------------------------
    LimitRequestBody 5242880

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # --------------------------------------------------------------------------
    # Reverse Proxy to Gunicorn Backend (http://127.0.0.1:5000)
    # --------------------------------------------------------------------------
    ProxyPreserveHost On
    ProxyRequests Off

    # Forward client IP, host, and scheme
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    RequestHeader set X-Forwarded-Port expr=%{SERVER_PORT}

    # Pass all requests to the Gunicorn WSGI server running CloudPix
    ProxyPass / http://127.0.0.1:5000/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:5000/

    # --------------------------------------------------------------------------
    # Logging Configuration
    # --------------------------------------------------------------------------
    ErrorLog ${APACHE_LOG_DIR}/cloudpix_error.log
    CustomLog ${APACHE_LOG_DIR}/cloudpix_access.log combined
</VirtualHost>

# ------------------------------------------------------------------------------
# Optional SSL Configuration (Generated automatically when using Certbot)
# To enable free HTTPS via Let's Encrypt, run:
#   sudo certbot --apache -d your-domain.com
# ------------------------------------------------------------------------------
